# Names in one place: the trademark question on "OTLET" is open, and the legal
# name is not final. Layout, header, footer, and pages read them from here.
title: OTLET
expansion: Own The Limits
tagline: Ethics in Tech
legal_name: "Otlet–La Fontaine Alliance"
legal_status: in formation
email: info@otlet.tech
description: "OTLET works with engineers, researchers, and students to make ethical responsibility part of how technology is built — through education, accountability, and a European network."
url: "https://otlet.tech"
baseurl: ""

# Copy Markdown files without front matter unchanged instead of rendering them as
# pages. GitHub Pages enables jekyll-optional-front-matter by default, which would
# turn each report's Markdown companion into an extra page in the site layout.
require_front_matter: true

# jekyll-redirect-from: `redirect_from` in a page's front matter (Advocacy uses it for
# /advocacy/reports/). sitemap.xml, built by GitHub Pages. Pages with `sitemap: false` (the drafts, beside
# `noindex: true`) are left out; robots.txt points to it.
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Files that must not be copied into the built site
exclude:
  - CLAUDE.md
  - HOUSE-STYLE.md
  - HOUSE-STYLE.proposed.md
  - house-style.patch
  - Gemfile
  - Gemfile.lock
  - claude-devcontainer.sh
  - vendor
  - node_modules
  - HARDENING-PLAN.md
  - misc
  - assets/Otlet_emblem_high-res.png
  - tools
